name: build-courses
on:
  workflow_run:
    workflows: ["build-tiles"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: courses
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: build courses
        run: node --max-old-space-size=6144 scripts/build-courses.js
      - name: commit
        if: always()
        run: |
          git config user.name "tile-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/mountains && git commit -m "courses: $(date -u +%F) $(ls data/mountains 2>/dev/null | wc -l) mountains" || echo "no changes"
          git pull --rebase origin main || true
          git push || true
